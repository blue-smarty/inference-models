[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hailo-runner"
version = "0.1.0"
description = "Generic Hailo-8 HEF inference runner"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "Pillow",
  "gradio",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
